
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Haiku</title>
    <link rel="stylesheet" href="./style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="grid-container">

        <div class="poem-line">
            <div>A</div>
            <div>storm</div>
            <div class="last">inside</div>
            <div>my</div>
            <div class="pink-glow">mind</div>
        </div>

        <div class="poem-line">
            <div>Waves</div>
            <div class="last">of</div>
            <div>thoughts</div>
            <div class="pink-glow">crash</div>
            <div>through</div>
            <div class="last">me</div>
        </div>

        <div class="poem-line">
            <div>Still,</div>
            <div>I</div>
            <div>find</div>
            <div class="last">the shore</div>
        </div>

    </div>

    <script src="./assets/js/main.js"></script>
</body>
</html>
